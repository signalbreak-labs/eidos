swagger: "2.0"
info:
  title: Mycloud
  version: "1.0.0"
host: api.mycloud.example
basePath: /v2
schemes:
  - http
  - https
tags:
  - name: pet
    description: Everything about your Pets
paths:
  /pets:
    get:
      operationId: listPets
      tags:
        - pet
      summary: List all pets
      produces:
        - application/json
      parameters:
        - name: limit
          in: query
          description: How many items to return at one time (max 100)
          required: false
          type: integer
          format: int32
      responses:
        "200":
          description: A paged array of pets
          schema:
            type: array
            items:
              $ref: '#/definitions/Pet'
    post:
      operationId: createPet
      tags:
        - pet
      summary: Create a pet
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: pet
          in: body
          description: Pet to add
          required: true
          schema:
            $ref: '#/definitions/Pet'
      responses:
        "201":
          description: Created pet
          schema:
            $ref: '#/definitions/Pet'
  /pets/{petId}:
    get:
      operationId: showPetById
      tags:
        - pet
      summary: Info for a specific pet
      parameters:
        - name: petId
          in: path
          required: true
          type: integer
          format: int64
      responses:
        "200":
          description: Expected response to a valid request
          schema:
            $ref: '#/definitions/Pet'
    delete:
      operationId: deletePet
      tags:
        - pet
      summary: Delete a pet
      parameters:
        - name: petId
          in: path
          required: true
          type: integer
          format: int64
        - name: api_key
          in: header
          required: false
          type: string
      responses:
        "204":
          description: Pet deleted
definitions:
  Pet:
    type: object
    required:
      - id
      - name
    properties:
      id:
        type: integer
        format: int64
      name:
        type: string
      tag:
        type: string
  Error:
    type: object
    required:
      - code
      - message
    properties:
      code:
        type: integer
        format: int32
      message:
        type: string
securityDefinitions:
  api_key:
    type: apiKey
    name: api_key
    in: header
  mycloud_auth:
    type: oauth2
    flow: implicit
    authorizationUrl: http://api.mycloud.example/oauth/dialog
    scopes:
      "write:pets": modify pets in your account
      "read:pets": read your pets
