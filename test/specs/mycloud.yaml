components:
  schemas:
    Container:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        image:
          type: string
        imagePullPolicy:
          type: string
    Instance:
      type: object
      required:
        - name
        - workspace
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        name:
          type: string
        workspace:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        spec:
          type: object
          properties:
            containers:
              type: array
              items:
                $ref: "#/components/schemas/Container"
        status:
          type: object
          properties:
            phase:
              type: string
    InstanceList:
      type: array
      items:
        $ref: "#/components/schemas/Instance"
    Network:
      type: object
      required:
        - name
        - workspace
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        name:
          type: string
        workspace:
          type: string
        spec:
          type: object
          properties:
            ipAddress:
              type: string
            ports:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  port:
                    type: integer
                    format: int32
                  protocol:
                    type: string
            selector:
              type: object
              additionalProperties:
                type: string
        status:
          type: object
          properties:
            loadBalancer:
              type: object
    NetworkList:
      type: array
      items:
        $ref: "#/components/schemas/Network"
    Stack:
      type: object
      required:
