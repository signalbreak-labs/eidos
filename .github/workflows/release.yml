name: Release

# Ships the eidos CLI to end users as a GitHub Release with cross-compiled
# binaries, archives, and checksums, and publishes the Homebrew cask to
# signalbreak-labs/homebrew-tap. This is the distribution path for the eidos
# tool itself; it does NOT publish to the Terraform Registry (eidos is a
# generator, not a provider). The .goreleaser.yml at the repo root drives the
# build. This is distinct from the release.yml eidos *generates* into
# downstream provider repos (see pkg/generator/build_files.go ReleaseWorkflow).
#
# This workflow fires on any v* tag push — human-pushed (manual/explicit
# releases) or pushed by release-please via the signalbreak-release-bot app
# token (tags are vX.Y.Z because release-please-config.json sets
# `include-component-in-tag: false`). App-token pushes are not suppressed like
# GITHUB_TOKEN pushes, so the release-please tag re-triggers this workflow;
# GoReleaser is
# idempotent on an existing release, so a double run is harmless. It can also
# be triggered manually (workflow_dispatch) to backfill binaries/cask for an
# existing tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # Mint a token for the signalbreak-release-bot GitHub App. This is what
      # lets GoReleaser push the cask to signalbreak-labs/homebrew-tap (the
      # app is on the tap's ruleset bypass list). GITHUB_TOKEN below handles the
      # GitHub Release on this repo.
      - name: Get GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          repositories: "eidos,homebrew-tap"

      # Pin the GoReleaser version so release artifacts are reproducible.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  # Publish the eidos CI image to GHCR. The image bundles eidos + the Go
  # toolchain + GoReleaser so a downstream provider's CI can run a single
  # container to regenerate the provider from a spec and publish it. This is
  # a parallel job to the binary/cask release above: it does not depend on the
  # GoReleaser build and uses a self-contained multi-stage Dockerfile (the
  # eidos binary is compiled from source inside the image). Runs on every v*
  # tag (and via workflow_dispatch).
  docker:
    name: CI image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Multi-arch (linux/amd64 + linux/arm64). The Go build in the builder
      # stage cross-compiles natively, so only the non-Go install steps run
      # under QEMU emulation for arm64.
      # NOTE: the docker/* actions below use major tags; dependabot (configured
      # for github-actions) will bump them. SHA-pin to match the rest of the
      # file once a preferred digest is chosen.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # github.ref_name is the tag (vX.Y.Z) for a tag push; the Dockerfile
          # injects it as main.version so `eidos --version` reports the release.
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/signalbreak-labs/eidos:${{ github.ref_name }}
            ghcr.io/signalbreak-labs/eidos:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max