name: Release Please

# Maintains a running release PR (`release-please-release` branch) that
# aggregates Conventional Commits and proposes the next version plus a
# generated CHANGELOG.md. On merge of the release PR, release-please creates a
# v* tag and a GitHub Release. The tag push is authored by the
# signalbreak-release-bot GitHub App, so it re-triggers release.yml (app-token
# pushes are not suppressed like GITHUB_TOKEN pushes), which runs GoReleaser to
# attach cross-compiled binaries and publish the Homebrew formula.
#
# This workflow replaces auto-release.yml (the in-repo Conventional-Commits
# detector and hand-rolled tag pusher). release.yml remains for human-pushed
# v* tags (manual/explicit releases).
#
# Conventional Commit discipline is required for correct version bumps:
#   BREAKING CHANGE footer / <type>!  -> major  (X.0.0)
#   feat(...)                         -> minor  (X.Y.0)
#   fix / perf / chore                -> patch  (X.Y.Z)
#   docs / test / style / refactor / build / ci / <untyped>
#                                    -> no release (skipped)
# The highest bump across the new commits wins. This is the same mapping the
# retired auto-release.yml documented; release-please enforces it directly.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

# Serialize so two rapid main pushes don't race on the release PR / tag.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Mint a token for the signalbreak-release-bot GitHub App. Unlike
      # GITHUB_TOKEN, app-token PRs trigger pull_request workflows (so CI runs
      # on the release PR) and the tag push re-triggers release.yml. The token
      # is scoped to the repos the app is installed on.
      - name: Get GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          repositories: "eidos,homebrew-tap"

      # Versioning + CHANGELOG ownership. `release-type: go` derives the module
      # version from go.mod; the v* tag prefix is the default for `go`. Config
      # and version history live in release-please-config.json and
      # .release-please-manifest.json at the repo root.
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          # ONE-TIME BOOTSTRAP: force the first release to be exactly v0.1.0
          # (the manifest baseline has no tag yet, so release-please would
          # otherwise bump to 0.2.0 on a feat). REMOVE THIS LINE after the
          # v0.1.0 release lands so subsequent releases bump normally.
          release-as: 0.1.0
